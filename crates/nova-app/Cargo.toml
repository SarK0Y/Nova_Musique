[package]
name = "nova-app"
description = "Desktop music player for Nova (egui/eframe)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The desktop app can't be published: its deps point at sibling crates, not crates.io.
publish = false

[[bin]]
name = "nova"
path = "src/main.rs"

[dependencies]
nova-core = { workspace = true, features = ["nofft"] }
nova-faav = { workspace = true }
eframe = { workspace = true }
image = { workspace = true }
rfd = { workspace = true }
walkdir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
